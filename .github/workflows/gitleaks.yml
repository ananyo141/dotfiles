name: gitleaks

# Scan for committed secrets on every push (all branches) and PR. The local
# pre-commit hook (.githooks/pre-commit) catches them before commit; this
# catches anything committed without it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # gitleaks-action comments on PRs with findings

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so pushed commits are scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for organization-owned repos
