
[colors]
draw_bold_text_with_bright_colors = true

[font]
size = 15

[font.bold]
family = "UbuntuMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "UbuntuMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "UbuntuMono Nerd Font"
style = "Italic"

[font.normal]
family = "UbuntuMono Nerd Font"
style = "Normal"

[window]
opacity = 0.9
padding = { x = 0, y = 0 }
decorations = "Buttonless"

[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]
